name: Build and Push Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY_OWNER: dineth123412

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./services/api-gateway
          - name: identity
            context: ./services/identity-service
          - name: inventory
            context: ./services/inventory-service
          - name: sales
            context: ./services/sales-service
          - name: master
            context: ./services/master-data-service
          - name: report
            context: ./services/reporting-service
          - name: procurement
            context: ./services/procurement-service
          - name: finance
            context: ./services/finance-service
          - name: frontend
            context: ./frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY_OWNER }}/${{ matrix.name }}:latest
            ${{ env.REGISTRY_OWNER }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max